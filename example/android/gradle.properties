org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 defaults to built-in Kotlin and a new DSL. Both are still incompatible with
# this project's dependency graph: Flutter's own 'dev.flutter.flutter-gradle-plugin'
# NPEs under built-in Kotlin (FlutterPluginUtils.getLegacyAndroidExtension) and casts
# to the old AbstractAppExtension under the new DSL, and the permission_handler_android
# plugin (a transitive pub.dev dependency, not ours) still applies 'kotlin-android'
# itself. Both opt-outs are required until Flutter's SDK tooling and third-party
# plugins in the dependency tree catch up; they are removed in AGP 10 (mid-2026).
android.builtInKotlin=false
android.newDsl=false
