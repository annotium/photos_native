org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 defaults to built-in Kotlin and a new DSL, both of which conflict with the
# 'kotlin-android'/'kotlin-kapt' plugins this project (and photos_native) still apply.
# Temporary opt-out until the Glide annotation processor is migrated from kapt to KSP
# and the plugin adopts built-in Kotlin; both opt-outs are removed in AGP 10.
android.builtInKotlin=false
android.newDsl=false
