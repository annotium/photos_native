name: photos_native
description: High performance Flutter plugin for photos library. It can load photo albums, load image/thumnail, save, share...
version: 1.0.0
homepage: https://annotium.github.io

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  crypto: ^3.0.7
  equatable: ^2.1.0
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: dev.annotium.photos_native
        pluginClass: PhotosNativePlugin
      ios:
        pluginClass: PhotosNativePlugin
